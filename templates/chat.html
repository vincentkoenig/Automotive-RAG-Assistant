<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <title>Musterhaus Mobility – Interner Wissensassistent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h1>Interner Wissensassistent</h1>
        <p class="subtitle">Fragen zu Garantie, Leasing, Werkstattabläufen und internen Prozessen</p>

        <a href="{{ url_for('documents') }}" class="documents-link">📄 Alle Dokumente durchsuchen</a>

        <div id="chat-history">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <p>Stelle eine Frage zu Garantie, Leasing oder Werkstattabläufen –<br>ich durchsuche dafür die internen Dokumente.</p>
            </div>
        </div>

        <form id="chat-form">
            <input type="text" id="query-input" placeholder="Stelle deine Frage..." autocomplete="off" required>
            <button type="submit">Senden</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("query-input");
        const history = document.getElementById("chat-history");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            const emptyState = document.querySelector(".empty-state");
            if (emptyState) emptyState.remove();

            appendMessage("user", query);
            saveChatHistory();
            input.value = "";
            input.disabled = true;

            const loadingMessage = appendTypingIndicator();

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();

                loadingMessage.remove();

                if (data.error) {
                    appendMessage("bot", "Fehler: " + data.error);
                } else {
                    appendMessage("bot", data.answer);
                    appendSourceLinks(data.sources);
                }
                saveChatHistory();
            } catch (err) {
                loadingMessage.remove();
                appendMessage("bot", "Es gab ein technisches Problem. Bitte erneut versuchen.");
                saveChatHistory();
            } finally {
                input.disabled = false;
                input.focus();
            }
        });

        function appendMessage(role, text) {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message " + role;
            messageDiv.textContent = text;
            history.appendChild(messageDiv);
            history.scrollTop = history.scrollHeight;
            return messageDiv;
        }

        function appendTypingIndicator() {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message bot typing-indicator";
            messageDiv.innerHTML = '<span></span><span></span><span></span>';
            history.appendChild(messageDiv);
            history.scrollTop = history.scrollHeight;
            return messageDiv;
        }

        function appendSourceLinks(sources) {
            if (!sources.length) return;

            const sourcesDiv = document.createElement("div");
            sourcesDiv.className = "sources";
            sourcesDiv.appendChild(document.createTextNode("Quelle(n): "));

            sources.forEach((source, index) => {
                const link = document.createElement("a");
                link.href = "/documents/" + encodeURIComponent(source);
                link.textContent = source;
                link.target = "_blank";
                sourcesDiv.appendChild(link);

                if (index < sources.length - 1) {
                    sourcesDiv.appendChild(document.createTextNode(", "));
                }
            });

            history.appendChild(sourcesDiv);
            history.scrollTop = history.scrollHeight;
        }

        function saveChatHistory() {
            // Speichert den aktuellen HTML-Inhalt des Chatverlaufs im Browser.
            // sessionStorage bleibt bei einem Reload erhalten, wird aber beim
            // Schließen des Tabs gelöscht - für eine Live-Demo genau richtig.
            sessionStorage.setItem("chatHistory", history.innerHTML);
        }

        function loadChatHistory() {
            const saved = sessionStorage.getItem("chatHistory");
            if (saved) {
                history.innerHTML = saved;
                history.scrollTop = history.scrollHeight;
                return true;
            }
            return false;
        }
        // Beim Laden der Seite: gespeicherten Chatverlauf wiederherstellen,
        // falls vorhanden (z.B. nach einem versehentlichen Reload)
        loadChatHistory();
    </script>
</body>
</html>
