<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Interne Dokumente – Musterhaus Mobility</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h1>Interne Dokumente</h1>
        <p class="subtitle">Übersicht aller Dokumente, die der Wissensassistent durchsucht</p>

        <div class="document-grid">
            {% for doc in documents %}
                <a href="{{ url_for('view_document', filename=doc.filename) }}" class="document-card">
                    <div class="document-card-icon">📄</div>
                    <div class="document-card-name">{{ doc.filename }}</div>
                    <div class="document-card-meta">{{ doc.content|length }} Zeichen</div>
                </a>
            {% endfor %}
        </div>

        <p><a href="{{ url_for('index') }}">&larr; Zurück zum Chat</a></p>
    </div>
</body>
</html>
